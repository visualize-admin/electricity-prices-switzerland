name: E2E tooling
on:
  deployment_status:
jobs:
  context:
    name: "Vercel deployment"
    if: github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current: ${{ steps.context.outputs.current }}
      branch: ${{ steps.context.outputs.branch }}
      pr: ${{ steps.context.outputs.pr }}
    steps:
      - name: Find branch and pull request
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
          STATE: ${{ github.event.deployment_status.state }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
        run: |
          if [ "$STATE" != "success" ]; then
            echo "Vercel deployment state: $STATE"
            exit 1
          fi
          if [ "$ENVIRONMENT" = "Production" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/branches-where-head" --jq '[.[].name | select(. != "main")][0] // empty')
          if [ -z "$branch" ]; then
            echo "A newer commit was pushed, skipping the tests"
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "current=true" >> "$GITHUB_OUTPUT"

  integration:
    name: "Vitest · integration"
    needs: context
    if: needs.context.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: "Install dependencies"
        uses: ./.github/workflows/install-deps

      - name: Integration tests
        run: pnpm run test:integration
        env:
          BASIC_AUTH_CREDENTIALS: ${{ secrets.BASIC_AUTH_CREDENTIALS }}
          DEPLOYMENT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}

  playwright-app:
    name: "App · shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
    needs: context
    if: needs.context.outputs.current == 'true'
    timeout-minutes: 12
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Playwright shards slice an ordered list of test groups (not per-test hash).
        # Six shards (~7–8 app tests each) reduces wall-time variance vs four (~11–12).
        shardIndex: [1, 2, 3, 4, 5, 6]
        shardTotal: [6]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: "Install dependencies"
        uses: ./.github/workflows/install-deps

      - name: "Install playwright"
        uses: ./.github/workflows/install-playwright

      - name: Run application tests
        env:
          PLAYWRIGHT_ARGOS_SUITE: app
          PLAYWRIGHT_GRAPHQL_METRICS: "1"
          ARGOS_PARALLEL_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          BASIC_AUTH_CREDENTIALS: ${{ secrets.BASIC_AUTH_CREDENTIALS }}
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PLAYWRIGHT_NO_WEBSERVER: true
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          ARGOS_BRANCH: ${{ needs.context.outputs.branch }}
          ARGOS_PR_NUMBER: ${{ needs.context.outputs.pr }}
          VERCEL_GIT_PULL_REQUEST_ID: ${{ needs.context.outputs.pr }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ARGOS_THRESHOLD: 0.75
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          pnpm exec playwright test
          --grep-invert "@storybook|@har|@ignore"
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: graphql-metrics-shard-${{ matrix.shardIndex }}
          path: test-results/graphql-metrics.json
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: blob-report-app-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: warn

  playwright-storybook:
    name: "Storybook"
    needs: context
    if: needs.context.outputs.current == 'true'
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: "Install dependencies"
        uses: ./.github/workflows/install-deps

      - name: "Install playwright"
        uses: ./.github/workflows/install-playwright

      - name: Run storybook tests
        env:
          PLAYWRIGHT_ARGOS_SUITE: storybook
          PLAYWRIGHT_GRAPHQL_METRICS: "0"
          BASIC_AUTH_CREDENTIALS: ${{ secrets.BASIC_AUTH_CREDENTIALS }}
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}/storybook
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          ARGOS_BRANCH: ${{ needs.context.outputs.branch }}
          ARGOS_PR_NUMBER: ${{ needs.context.outputs.pr }}
          ARGOS_THRESHOLD: 0.75
        run: |
          CURL_ARGS=("-f")

          # Add basic auth if we have the secret
          if [ -n "$BASIC_AUTH_CREDENTIALS" ]; then
            CURL_ARGS+=("-u" "$BASIC_AUTH_CREDENTIALS")
          fi

          # Add Vercel automation header if we have the secret
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            CURL_ARGS+=("-H" "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi

          curl "${CURL_ARGS[@]}" "$PLAYWRIGHT_BASE_URL/index.json" -o storybook-index.json
          pnpm run test:playwright:storybook

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: blob-report-storybook
          path: blob-report/
          retention-days: 7
          if-no-files-found: warn

  playwright-merge-reports:
    name: "Playwright · merged HTML report"
    if: ${{ always() && !cancelled() && needs.context.outputs.current == 'true' }}
    needs: [context, playwright-app, playwright-storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 1 }
      - uses: ./.github/workflows/install-deps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: |
          set -e
          if [ ! -d all-blob-reports ] || [ -z "$(find all-blob-reports -type f | head -1)" ]; then
            echo "skip merge (no blobs)"; exit 0; fi
          pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  ci:
    name: "Merge gate"
    needs:
      - context
      - integration
      - playwright-app
      - playwright-storybook
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs succeeded
        run: |
          test "${{ needs.context.result }}" = "success"
          if [ "${{ needs.context.outputs.current }}" != "true" ]; then
            echo "A newer commit was pushed, this commit was not tested"
            exit 1
          fi
          test "${{ needs.integration.result }}" = "success"
          test "${{ needs.playwright-app.result }}" = "success"
          test "${{ needs.playwright-storybook.result }}" = "success"
